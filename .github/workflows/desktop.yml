name: Desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-13
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor
        run: pnpm build
        env:
          NX_DAEMON: 'false'

      - name: Build cache server (macOS)
        if: runner.os == 'macOS'
        run: desktop/scripts/build-redis-mac.sh

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: make gcc pkg-config curl tar

      - name: Build cache server (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: desktop/scripts/build-redis-win.sh

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Bundle app resources
        working-directory: desktop
        run: node scripts/prepare-resources.mjs

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: KrorDas-Docs-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: KrorDas Docs ${{ github.ref_name }}
          files: dist/*
